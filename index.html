<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebel PvP • Ultimate FiveM PvP Experience</title>
<link rel="icon" href="pictures/serverprofile.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060d; --panel:rgba(20,16,34,.88); --panel2:rgba(255,255,255,.04);
  --line:rgba(168,85,247,.24); --a:#a855f7; --a2:#7c3aed; --a3:#c084fc;
  --txt:#f3f0fa; --mut:#9a93b3; --ok:#10b981; --bad:#ef4444; --warn:#f59e0b;
  --head:'Rajdhani',sans-serif; --body:'Poppins',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;line-height:1.5}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 85% -5%,rgba(124,58,237,.22),transparent 60%),radial-gradient(700px 500px at -5% 40%,rgba(168,85,247,.10),transparent 60%),var(--bg)}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--a3);outline-offset:2px}
.hidden{display:none!important}

/* HEADER */
header{position:fixed;top:0;width:100%;z-index:1000;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 6%;background:rgba(9,7,16,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo img{width:44px;height:44px;border-radius:10px;object-fit:cover;border:2px solid var(--a);box-shadow:0 0 16px rgba(168,85,247,.55)}
.logo b{font-family:var(--head);font-size:1.7rem;letter-spacing:1.5px;font-weight:700}
.logo b span{color:var(--a3)}
nav ul{display:flex;list-style:none;gap:22px;align-items:center}
nav a{color:#cfc9e2;text-decoration:none;font-weight:500;font-size:.92rem;cursor:pointer;transition:.2s}
nav a:hover,nav a.active{color:var(--a3)}
.nav-btn{background:linear-gradient(45deg,var(--a2),var(--a));color:#fff!important;padding:8px 20px;border-radius:8px;box-shadow:0 0 16px rgba(168,85,247,.45)}
.hdr-right{display:flex;align-items:center;gap:14px}
.burger{display:none;background:none;border:1px solid var(--line);color:#fff;width:40px;height:40px;border-radius:8px;font-size:1.1rem;cursor:pointer}
.user-chip{position:relative}
.user-btn{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);color:#fff;padding:5px 12px 5px 5px;border-radius:30px;cursor:pointer;font-weight:600;font-size:.9rem}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:210px;background:#120e1f;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.7)}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:8px;color:#ddd6f0;text-decoration:none;background:none;border:none;font-size:.88rem;cursor:pointer;text-align:left}
.menu a:hover,.menu button:hover{background:rgba(168,85,247,.16)}
.menu hr{border:none;border-top:1px solid var(--line);margin:5px 0}

/* GENERIC */
main{padding-top:70px;min-height:80vh}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
.page{padding:42px 0 70px}
.section-title{font-family:var(--head);text-align:center;font-size:2.4rem;font-weight:700;margin-bottom:34px;letter-spacing:.5px}
.section-title span{color:var(--a3)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border-radius:9px;font-weight:600;text-decoration:none;cursor:pointer;border:none;font-size:.95rem;color:#fff;transition:.2s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(45deg,var(--a2),var(--a));box-shadow:0 0 20px rgba(168,85,247,.45)}
.btn-discord{background:#5865F2;box-shadow:0 0 20px rgba(88,101,242,.35)}
.btn-ghost{background:var(--panel2);border:1px solid var(--line)}
.btn-ok{background:linear-gradient(45deg,#059669,var(--ok))}
.btn-bad{background:linear-gradient(45deg,#b91c1c,var(--bad))}
.btn-warn{background:linear-gradient(45deg,#d97706,var(--warn))}
.btn-sm{padding:7px 14px;font-size:.8rem;border-radius:7px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
input,textarea,select{width:100%;padding:12px 14px;background:rgba(8,6,15,.9);border:1px solid rgba(255,255,255,.14);border-radius:9px;color:#fff;font-size:.95rem;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--a)}
textarea{min-height:150px;resize:vertical}
label{display:block;font-size:.82rem;color:var(--mut);margin:0 0 6px;font-weight:500}
.field{margin-bottom:16px}
.muted{color:var(--mut)}
.err{color:#fca5a5;font-size:.88rem;min-height:1.3em;margin-bottom:10px}

/* AVATAR + BADGES */
.av{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;font-weight:700;color:#fff;flex-shrink:0;border:2px solid var(--c,#555);background:#1b1530}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rank{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:2px 10px;border-radius:20px;border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.prefix{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:5px;color:#fff;background:var(--c);margin-right:8px;vertical-align:middle}
.uname{font-weight:600;text-decoration:none}
.uname:hover{text-decoration:underline}

/* HERO */
.hero-banner{height:clamp(300px,58vh,560px);background:url('pictures/serverbanner.png') center/cover no-repeat;position:relative;margin-top:-70px}
.hero-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(7,6,13,.55) 0,rgba(7,6,13,0) 28%,rgba(7,6,13,.65) 78%,var(--bg) 100%)}
.hero-main{display:grid;grid-template-columns:1.25fr 1fr;gap:46px;align-items:start;margin-top:-70px;position:relative;z-index:2;padding-bottom:70px}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(168,85,247,.16);border:1px solid var(--a);color:var(--a3);padding:5px 16px;border-radius:20px;font-size:.82rem;font-weight:600;margin-bottom:18px}
.hero-main h1{font-family:var(--head);font-size:3.9rem;line-height:1;font-weight:700;margin-bottom:16px}
.hero-main h1 em{font-style:normal;color:var(--a3);text-shadow:0 0 26px rgba(168,85,247,.75)}
.hero-main p.lead{color:#b4aecb;font-size:1.05rem;margin-bottom:26px;max-width:560px}
.actions{display:flex;gap:14px;flex-wrap:wrap}
.founders{padding:26px}
.team-title{font-family:var(--head);font-size:1.4rem;font-weight:700;margin-bottom:18px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}
.team-list{display:flex;flex-direction:column;gap:12px}
.team-card{display:flex;align-items:center;gap:14px;background:var(--panel2);padding:10px 14px;border-radius:12px;border-left:3px solid var(--a)}
.team-card img{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid var(--a)}
.team-card h4{font-size:1rem}
.team-card p{font-size:.78rem;color:var(--a3);font-weight:600}
.discord-tag{font-size:.74rem;color:var(--mut)}

/* SECTIONS (home) */
.content-section{padding:56px 0}
.leaderboard-container{overflow:hidden;max-width:900px;margin:0 auto}
.leaderboard-table{width:100%;border-collapse:collapse}
.leaderboard-table th,.leaderboard-table td{padding:14px 18px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);font-size:.93rem}
.leaderboard-table th{background:rgba(168,85,247,.18);color:var(--a3);font-size:.8rem;font-weight:600}
.turf-box{margin:28px auto 0;max-width:900px;border:2px solid var(--ok);padding:24px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:0 0 24px rgba(16,185,129,.25)}
.turf-box h3{color:var(--ok);font-family:var(--head);font-size:1.6rem}
.turf-box p{color:#ccc;font-size:.92rem;margin:3px 0}
.turf-100{background:var(--ok);color:#000;font-weight:700;padding:4px 14px;border-radius:20px;font-size:.85rem;display:inline-block;margin-bottom:8px}
.turf-img{width:220px;height:120px;border-radius:10px;object-fit:cover;border:2px solid var(--ok)}
.hl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
.hl-card{overflow:hidden}
.hl-card iframe{width:100%;height:200px;border:none;display:block}
.hl-info{padding:14px 16px}
.hl-title{font-weight:600;margin-bottom:4px}
.hl-meta{font-size:.78rem;color:var(--mut)}
.hl-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.features-section{padding:56px 6%;background:rgba(10,8,18,.6)}
.features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;max-width:1120px;margin:0 auto}
.feature-box{background:var(--panel);border:1px solid rgba(255,255,255,.06);padding:28px;border-radius:14px;text-align:center}
.feature-box i{font-size:2.3rem;color:var(--a3);margin-bottom:16px}
.feature-box h3{font-size:1.1rem;margin-bottom:10px}
.feature-box p{color:var(--mut);font-size:.88rem}
.rules-section{padding:56px 6%;max-width:1120px;margin:0 auto}
.rules-category{margin-bottom:36px}
.rules-category-title{font-family:var(--head);font-size:1.5rem;font-weight:700;color:var(--a3);margin-bottom:16px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--line);padding-bottom:8px}
.rules-list{display:flex;flex-direction:column;gap:10px}
.rule-item{background:var(--panel);border-left:3px solid var(--a);padding:14px 18px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.rule-text{color:#d7d2e6;font-size:.93rem;flex:1}
.rule-punishment{background:rgba(168,85,247,.14);border:1px solid var(--line);color:var(--a3);padding:3px 12px;border-radius:20px;font-size:.78rem;font-weight:600;white-space:nowrap}

/* AUTH PAGE */
.auth-page{min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:36px 18px;background:linear-gradient(rgba(7,6,13,.7),rgba(7,6,13,.92)),url('pictures/serverbanner.png') center/cover fixed}
.auth-shell{display:grid;grid-template-columns:1.05fr 1fr;width:100%;max-width:1000px;overflow:hidden;padding:0;border-color:rgba(168,85,247,.4);box-shadow:0 0 80px rgba(124,58,237,.25),0 25px 60px rgba(0,0,0,.7)}
.auth-brand{padding:38px;display:flex;flex-direction:column;justify-content:space-between;gap:30px;background:linear-gradient(160deg,rgba(124,58,237,.38),rgba(8,6,15,.93) 62%),url('pictures/serverbanner.png') 30% center/cover}
.auth-logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.auth-logo img{width:46px;height:46px;border-radius:12px;border:2px solid var(--a);object-fit:cover}
.auth-logo b{font-family:var(--head);font-size:1.7rem;letter-spacing:1.5px}.auth-logo b span{color:var(--a3)}
.auth-brand h2{font-family:var(--head);font-size:2.7rem;line-height:1.02;margin-bottom:14px}
.auth-brand p{color:#b9b2d1;font-size:.93rem;max-width:380px}
.auth-points{list-style:none;margin-top:24px;display:flex;flex-direction:column;gap:14px}
.auth-points li{display:flex;gap:14px;align-items:flex-start}
.auth-points i{width:38px;height:38px;border-radius:10px;background:rgba(168,85,247,.18);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--a3);flex-shrink:0}
.auth-points b{display:block;font-size:.92rem}.auth-points span{font-size:.8rem;color:var(--mut)}
.auth-brand small{color:#6f6889;font-size:.76rem}
.auth-form{padding:38px 40px;display:flex;flex-direction:column;justify-content:center;background:rgba(14,10,26,.96)}
.auth-form h1{font-family:var(--head);font-size:2.2rem;line-height:1.05;margin-bottom:4px}
.auth-form .sub{color:var(--mut);font-size:.88rem;margin-bottom:20px}
.tabs{display:flex;background:rgba(0,0,0,.4);border-radius:11px;padding:4px;margin-bottom:24px}
.tabs a{flex:1;text-align:center;padding:10px;border-radius:8px;text-decoration:none;font-weight:600;font-size:.9rem;color:var(--mut);transition:.2s}
.tabs a.on{background:linear-gradient(45deg,var(--a2),var(--a));color:#fff;box-shadow:0 0 16px rgba(168,85,247,.4)}
.ico-input{position:relative}
.ico-input>i.lead{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--a3);font-size:.95rem;pointer-events:none}
.ico-input input{padding:14px 44px 14px 42px}
.ico-input button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--mut);width:36px;height:36px;cursor:pointer;border-radius:8px}
.ico-input button:hover{color:#fff}
.strength{height:4px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden}
.strength i{display:block;height:100%;width:0;transition:.25s;border-radius:4px}
.strength-txt{font-size:.72rem;color:var(--mut);margin-top:5px;min-height:1em}
.auth-err{display:flex;gap:10px;align-items:flex-start;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.45);color:#fecaca;padding:11px 14px;border-radius:10px;font-size:.85rem;margin-bottom:14px}
.auth-note{display:flex;gap:10px;align-items:flex-start;font-size:.78rem;color:var(--mut);background:rgba(168,85,247,.07);border:1px solid var(--line);padding:10px 12px;border-radius:10px;margin-bottom:16px}
.auth-note i{color:var(--a3);margin-top:2px}
.auth-back{text-align:center;margin-top:18px;font-size:.82rem}.auth-back a{color:var(--mut);text-decoration:none}.auth-back a:hover{color:var(--a3)}
@media(max-width:860px){.auth-shell{grid-template-columns:1fr}.auth-brand{display:none}.auth-form{padding:30px 24px}}

/* FORUM */
.crumbs{font-size:.85rem;color:var(--mut);margin-bottom:18px}
.crumbs a{text-decoration:none;color:var(--a3)}
.page-head{margin-bottom:24px}
.page-head h1{font-family:var(--head);font-size:2.4rem}
.cat-list{display:flex;flex-direction:column;gap:12px}
.cat{display:grid;grid-template-columns:54px 1fr 150px 260px;gap:18px;align-items:center;padding:18px 22px;text-decoration:none;transition:.2s}
.cat:hover{border-color:var(--a)}
.cat-ico{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);border:1px solid var(--c)}
.cat h3{font-size:1.08rem}
.cat p{font-size:.83rem;color:var(--mut)}
.cat .stat{font-size:.82rem;color:var(--mut);text-align:center}
.cat .stat b{display:block;color:#fff;font-size:1.05rem}
.cat .last{font-size:.8rem;color:var(--mut);overflow:hidden}
.cat .last a{display:block;color:#e6e1f5;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input{max-width:280px}
.t-list{overflow:hidden}
.t-row{display:grid;grid-template-columns:1fr 90px 90px 190px;gap:14px;align-items:center;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.06);text-decoration:none}
.t-row:last-child{border-bottom:none}
.t-row:hover{background:rgba(168,85,247,.07)}
.t-row.pin{background:rgba(168,85,247,.06)}
.t-title{font-weight:600;font-size:.98rem}
.t-sub{font-size:.78rem;color:var(--mut);margin-top:2px}
.t-num{text-align:center;font-size:.8rem;color:var(--mut)}
.t-num b{display:block;color:#fff;font-size:.98rem}
.t-last{font-size:.78rem;color:var(--mut)}
.empty{padding:44px;text-align:center;color:var(--mut)}
.pager{display:flex;justify-content:center;gap:10px;margin-top:20px}

.thread-title{font-family:var(--head);font-size:2.1rem;line-height:1.15;margin-bottom:8px}
.modbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px;margin-bottom:18px;border-color:rgba(245,158,11,.4)}
.modbar select{width:auto;padding:7px 10px;font-size:.82rem}
.modbar .lbl{font-size:.78rem;color:var(--warn);font-weight:600;display:flex;gap:6px;align-items:center}
.post{display:grid;grid-template-columns:190px 1fr;margin-bottom:14px;overflow:hidden}
.post-side{padding:20px 14px;text-align:center;background:rgba(0,0,0,.25);border-right:1px solid var(--line)}
.post-side .uname{display:block;margin:10px 0 6px;word-break:break-all}
.post-side small{display:block;color:var(--mut);font-size:.72rem;margin-top:8px}
.post-body{padding:18px 22px;display:flex;flex-direction:column;min-width:0}
.post-meta{font-size:.78rem;color:var(--mut);display:flex;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.post-text{font-size:.96rem;word-wrap:break-word;overflow-wrap:anywhere;flex:1}
.post-text a{color:var(--a3)}
.post-foot{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.post.staff{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.embed{margin-bottom:18px;overflow:hidden}
.embed iframe{width:100%;aspect-ratio:16/9;border:none;display:block}
.locked-note{padding:16px;text-align:center;color:var(--warn);background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:12px}

.profile-head{padding:30px;display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.profile-head h1{font-family:var(--head);font-size:2.3rem}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.stat-row{display:flex;gap:26px;margin-top:10px}
.stat-row div{font-size:.8rem;color:var(--mut)}
.stat-row b{display:block;font-size:1.3rem;color:#fff}
.set-card{padding:26px;max-width:640px;margin-bottom:20px}
.set-card h3{font-family:var(--head);font-size:1.5rem;margin-bottom:16px}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:11px 14px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);font-size:.88rem}
.tbl th{color:var(--a3);font-size:.78rem;background:rgba(168,85,247,.12)}
.tbl select{width:auto;padding:6px 8px;font-size:.82rem}
.scroll-x{overflow-x:auto}
.pf-chip{display:inline-flex;align-items:center;gap:8px;margin:0 8px 8px 0;padding:5px 6px 5px 12px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font-size:.82rem}
.pf-chip button{background:none;border:none;color:var(--bad);cursor:pointer;width:22px;height:22px;border-radius:50%}

/* MODAL + TOAST */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:2000;padding:16px}
.modal-content{background:#120e1f;padding:28px;border-radius:14px;width:560px;max-width:100%;max-height:88vh;overflow-y:auto;border:1px solid var(--a);box-shadow:0 18px 40px rgba(0,0,0,.9)}
.modal-content h3{font-family:var(--head);font-size:1.5rem;margin-bottom:18px;color:var(--a3);display:flex;gap:10px;align-items:center}
.modal-buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.lb-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:8px}
#toasts{position:fixed;right:18px;bottom:18px;z-index:3000;display:flex;flex-direction:column;gap:10px}
.toast{background:#1a1430;border:1px solid var(--line);border-left:4px solid var(--a);padding:12px 18px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.7);font-size:.9rem;max-width:340px;animation:tin .25s ease}
.toast.bad{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
footer{text-align:center;padding:26px;background:#050409;border-top:1px solid rgba(255,255,255,.05);color:#777;font-size:.85rem}

@media(max-width:960px){
  header{padding:10px 4%}
  .burger{display:block}
  nav{position:absolute;top:100%;left:0;right:0;background:#0c0916;border-bottom:1px solid var(--line);display:none}
  nav.open{display:block}
  nav ul{flex-direction:column;align-items:stretch;gap:0;padding:8px 4%}
  nav ul li a{display:block;padding:12px 4px}
  .hero-main{grid-template-columns:1fr}

<script>
/* ============================ helpers ============================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = t => esc(t).replace(/(https?:\/\/[^\s<]+)/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer nofollow">${u}</a>`).replace(/\n/g, '<br>');
function ago(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'şimdi';
  if (s < 3600) return Math.floor(s / 60) + ' dk önce';
  if (s < 86400) return Math.floor(s / 3600) + ' sa önce';
  if (s < 2592000) return Math.floor(s / 86400) + ' gün önce';
  return new Date(ts).toLocaleDateString('tr-TR');
}
const dt = ts => new Date(ts).toLocaleString('tr-TR', { dateStyle: 'medium', timeStyle: 'short' });

async function api(method, url, body) {
  const opt = { method, credentials: 'same-origin', headers: { 'X-Requested-With': 'rebel' } };
  if (method !== 'GET' && method !== 'DELETE') { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body || {}); }
  const r = await fetch(url, opt);
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error(d.error || 'Bir hata oluştu.'); e.status = r.status; throw e; }
  return d;
}
function toast(msg, type = '') {
  const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3800);
}
const fail = e => toast(e.message || 'Hata', 'bad');

const avatar = (u, size = 40) => `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .42)}px;--c:${esc(u.color)}">${esc((u.username || '?')[0].toUpperCase())}${u.avatar ? `<img src="${esc(u.avatar)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}</span>`;
const SPECIAL_RANK = { project_co_leader: 1, project_leader: 1 };
const rankBadge = u => `<span class="rank rk-${esc(u.rank)}" style="--c:${esc(u.color)}"><span class="rt">${esc(u.rankName)}</span></span>`;
const prefixBadge = p => p ? `<span class="prefix" style="--c:${esc(p.color)}">${esc(p.name)}</span>` : '';
const nameAttr = u => SPECIAL_RANK[u.rank] ? `class="uname nm-${esc(u.rank)}"` : `class="uname" style="color:${u.level >= 30 ? esc(u.color) : '#fff'}"`;
const userLink = u => `<a ${nameAttr(u)} href="#/u/${encodeURIComponent(u.username)}">${esc(u.username)}</a>`;

let me = null, meta = { ranks: [], prefixes: [] }, routeToken = 0;

/* ============================ header ============================ */
function renderUserArea() {
  const el = $('#user-area');
  if (!me) { el.innerHTML = `<a class="btn btn-primary btn-sm" href="#/login"><i class="fa-solid fa-right-to-bracket"></i> Giriş Yap</a>`; return; }
  el.innerHTML = `<div class="user-chip">
    <button class="user-btn" id="user-btn">${avatar(me, 32)} ${esc(me.username)} <i class="fa-solid fa-chevron-down" style="font-size:.7rem"></i></button>
    <div class="menu hidden" id="user-menu">
      <div style="padding:8px 12px">${rankBadge(me)}</div><hr>
      <a href="#/u/${encodeURIComponent(me.username)}"><i class="fa-solid fa-user"></i> Profilim</a>
      <a href="#/settings"><i class="fa-solid fa-gear"></i> Ayarlar</a>
      ${me.can.banUsers ? `<a href="#/admin"><i class="fa-solid fa-user-shield"></i> Yönetim Paneli</a>` : ''}
      <hr><button id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap</button>
    </div></div>`;
  $('#user-btn').onclick = e => { e.stopPropagation(); $('#user-menu').classList.toggle('hidden'); };
  $('#logout-btn').onclick = async () => { await api('POST', '/api/auth/logout'); me = null; renderUserArea(); location.hash = '#/home'; toast('Çıkış yapıldı.'); };
}
document.addEventListener('click', () => { const m = $('#user-menu'); if (m) m.classList.add('hidden'); });

/* ============================ router ============================ */
const view = $('#view');
function go(h) { location.hash = h; }
async function route() {
  const token = ++routeToken;
  clearInterval(window._cd);
  if (window._fxStop) { window._fxStop(); window._fxStop = null; }
  const parts = (location.hash.replace(/^#\/?/, '').split('?')[0] || 'home').split('/');
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === (parts[0] === 'forum' || parts[0] === 'new' ? 'forum' : parts[0])));
  window.scrollTo(0, 0);
  try {
    switch (parts[0]) {
      case 'home': await homeView(parts[1]); break;
      case 'login': authView('login'); break;
      case 'register': authView('register'); break;
      case 'forum':
        if (parts[1] === 'archive') await archiveView(token);
        else if (parts[1] === 'c') await categoryView(parts[2], token);
        else if (parts[1] === 't') await threadView(+parts[2], token);
        else await forumView(token);
        break;
      case 'new': await newThreadView(parts[1]); break;
      case 'u': await profileView(decodeURIComponent(parts[1] || '')); break;
      case 'settings': await settingsView(); break;
      case 'admin': await adminView(); break;
      default: await homeView();
    }
  } catch (e) {
    if (token !== routeToken) return;
    view.innerHTML = `<div class="wrap page"><div class="card empty"><i class="fa-solid fa-circle-exclamation" style="font-size:2rem;color:var(--bad)"></i><p style="margin-top:12px">${esc(e.message)}</p><p style="margin-top:16px"><a class="btn btn-ghost btn-sm" href="#/forum">Foruma dön</a></p></div></div>`;
  }
}
window.addEventListener('hashchange', route);

function needLogin(msg) {
  view.innerHTML = `<div class="wrap page"><div class="card empty"><i class="fa-solid fa-lock" style="font-size:2rem;color:var(--a3)"></i><p style="margin:12px 0 18px">${esc(msg || 'Bu sayfayı görmek için giriş yapmalısın.')}</p><a class="btn btn-primary" href="#/login">Giriş Yap</a></div></div>`;
}

  root.querySelector('.modal').addEventListener('mousedown', e => { if (e.target.classList.contains('modal')) closeModal(); });
  return root;
}
const closeModal = () => { $('#modal-root').innerHTML = ''; };

async function categoryView(id, token) {
  const page = parseInt(new URLSearchParams(location.hash.split('?')[1] || '').get('p')) || 1;
  const q = new URLSearchParams(location.hash.split('?')[1] || '').get('q') || '';
  const cats = await api('GET', '/api/forum/categories');
  const cat = cats.find(c => c.id === id);
  if (!cat) throw new Error('Kategori bulunamadı.');
  const d = await api('GET', `/api/forum/threads?category=${encodeURIComponent(id)}&page=${page}&q=${encodeURIComponent(q)}`);
  if (token !== routeToken) return;
  const pages = Math.max(1, Math.ceil(d.total / d.per));
  const base = `#/forum/c/${id}?q=${encodeURIComponent(q)}&p=`;
  view.innerHTML = `<div class="wrap page">
    <div class="crumbs"><a href="#/forum">Forum</a> / ${esc(cat.name)}</div>
    <div class="page-head row-between"><div><h1 style="color:${esc(cat.color)}"><i class="fa-solid ${esc(cat.icon)}"></i> ${esc(cat.name)}</h1><p class="muted">${esc(cat.description)}</p></div>
      ${me ? `<a class="btn btn-primary" href="#/new/${cat.id}"><i class="fa-solid fa-plus"></i> Konu Oluştur</a>` : `<a class="btn btn-primary" href="#/login">Konu açmak için giriş yap</a>`}</div>
    <div class="toolbar"><input id="c-q" placeholder="Bu kategoride ara..." value="${esc(q)}"></div>
    <div class="card t-list">${threadRows(d.threads, [cat])}</div>
    ${pages > 1 ? `<div class="pager">${page > 1 ? `<a class="btn btn-ghost btn-sm" href="${base}${page - 1}">‹ Önceki</a>` : ''}<span class="muted" style="align-self:center">${page} / ${pages}</span>${page < pages ? `<a class="btn btn-ghost btn-sm" href="${base}${page + 1}">Sonraki ›</a>` : ''}</div>` : ''}</div>`;
  $('#c-q').addEventListener('keydown', e => { if (e.key === 'Enter') go(`#/forum/c/${id}?q=${encodeURIComponent(e.target.value)}&p=1`); });
}

/* ============================ PROFİL EFEKTLERİ ============================ */
function startFx(canvas, type) {
  if (!canvas || !type || type === 'none') return null;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return null;
  const ctx = canvas.getContext('2d'), R = Math.random;
  let w = 1, h = 1, raf = 0, dead = false, frame = 0;
  const size = () => { const r = canvas.getBoundingClientRect(); w = canvas.width = Math.max(1, Math.floor(r.width)); h = canvas.height = Math.max(1, Math.floor(r.height)); };
  size();
  const ro = window.ResizeObserver ? new ResizeObserver(size) : null; if (ro) ro.observe(canvas);
  const make = init => {
    switch (type) {
      case 'snow': return { x: R() * w, y: init ? R() * h : -6, r: 1 + R() * 2.6, v: .4 + R() * 1.1, s: R() * 6.28 };
      case 'rain': return { x: R() * w, y: init ? R() * h : -20, l: 10 + R() * 14, v: 9 + R() * 6 };
      case 'embers': return { x: R() * w, y: init ? R() * h : h + 6, r: 1 + R() * 2.2, v: .5 + R() * 1.3, s: R() * 6.28 };
      default: return { x: R() * w, y: R() * h, r: 1.5 + R() * 2.5, t: R() * 6.28, sp: .03 + R() * .05 };
    }
  };
  const COUNT = { snow: 80, rain: 100, embers: 55, sparkle: 45 };
  const parts = [], cols = [], fs = 14, CH = 'アイウエオカキクケコサシスセソ0123456789ABCDEF';
  if (type !== 'matrix') for (let i = 0; i < COUNT[type]; i++) parts.push(make(true));
  const tick = () => {
    if (dead) return;
    frame++; ctx.clearRect(0, 0, w, h);
    if (type === 'matrix') {
      ctx.font = fs + 'px monospace';
      const n = Math.ceil(w / fs); while (cols.length < n) cols.push(R() * 40);
      for (let i = 0; i < n; i++) {
        for (let k = 0; k < 12; k++) {
          const y = (cols[i] - k) * fs; if (y < 0 || y > h) continue;
          ctx.fillStyle = k === 0 ? 'rgba(200,255,220,.95)' : `rgba(34,255,119,${(1 - k / 12) * .55})`;
          ctx.fillText(CH[(i * 7 + k * 3 + (k === 0 ? frame : 0)) % CH.length], i * fs, y);
        }
        if (frame % 3 === 0) { cols[i] += 1; if (cols[i] * fs > h + 12 * fs && R() > .975) cols[i] = 0; }
      }
    } else parts.forEach((p, i) => {
      switch (type) {
        case 'snow': p.y += p.v; p.s += .02; p.x += Math.sin(p.s) * .5; ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); if (p.y > h + 6) parts[i] = make(false); break;
        case 'rain': p.y += p.v; ctx.strokeStyle = 'rgba(170,200,255,.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 2, p.y + p.l); ctx.stroke(); if (p.y > h + 20) parts[i] = make(false); break;
        case 'embers': p.y -= p.v; p.s += .03; p.x += Math.sin(p.s) * .6; ctx.fillStyle = `rgba(255,${(90 + (p.y / h) * 120) | 0},40,${Math.max(0, p.y / h)})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); if (p.y < -6) parts[i] = make(false); break;
        default: {
          p.t += p.sp; const al = (Math.sin(p.t) + 1) / 2;
          ctx.strokeStyle = ctx.fillStyle = `rgba(255,230,150,${al})`; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(p.x - p.r * 2, p.y); ctx.lineTo(p.x + p.r * 2, p.y); ctx.moveTo(p.x, p.y - p.r * 2); ctx.lineTo(p.x, p.y + p.r * 2); ctx.stroke();
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r * .6, 0, 6.283); ctx.fill();
        }
      }
    });
    raf = requestAnimationFrame(tick);
  };
  tick();
  return () => { dead = true; cancelAnimationFrame(raf); if (ro) ro.disconnect(); };
}

function resizeImage(file, w, h, q = .86) {
  return new Promise((ok, no) => {
    if (!file || !/^image\//.test(file.type)) return no(new Error('Sadece resim dosyası seçebilirsin.'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#0c0916'; x.fillRect(0, 0, w, h);
      const s = Math.max(w / img.width, h / img.height), dw = img.width * s, dh = img.height * s;
      x.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error('Resim okunamadı.')); };
    img.src = url;
  });
}

      <div class="field"><label>Durum yazısı (en fazla 80 karakter)</label><input id="s-status" maxlength="80" value="${esc(D.status)}" placeholder="örn. Turf benim."></div>
      <div class="field"><label>Discord</label><input id="s-dc" maxlength="40" value="${esc(D.discord)}" placeholder="örn. onenightsuddenly"></div>
      <div class="field"><label>Bio (en fazla 300 karakter)</label><textarea id="s-bio" maxlength="300" style="min-height:110px">${esc(D.bio)}</textarea></div>
      <button class="btn btn-primary" id="s-save"><i class="fa-solid fa-floppy-disk"></i> Değişiklikleri Kaydet</button></div>
    <div class="card set-card"><h3>Şifre Değiştir</h3>
      <div class="field"><label>Mevcut şifre</label><input id="p-cur" type="password" autocomplete="current-password"></div>
      <div class="field"><label>Yeni şifre</label><input id="p-new" type="password" autocomplete="new-password"></div>
      <button class="btn btn-ghost" id="p-save">Şifreyi Güncelle</button></div>
  </div>
  <div class="set-prev"><h4><i class="fa-solid fa-eye"></i> Canlı önizleme</h4><div id="pv"></div></div></div></div>`;

  let timer;
  const drawPreview = () => {
    if (!$('#pv')) return;
    if (window._fxStop) { window._fxStop(); window._fxStop = null; }
    $('#pv').innerHTML = profileCard(pv(), info.stats, info.recent, { compact: true });
    window._fxStop = startFx($('#pv .pfx'), D.fx);
    $('#th-av').innerHTML = avatar(pv(), 64);
    const bn = pv().banner; $('#th-bn').innerHTML = bn ? `<img src="${esc(bn)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  };
  const soon = () => { clearTimeout(timer); timer = setTimeout(drawPreview, 200); };
  drawPreview();

  const bind = (id, key) => $(id).addEventListener('input', e => { D[key] = e.target.value; soon(); });
  bind('#f-avatar', 'avatarUrl'); bind('#f-banner', 'bannerUrl'); bind('#s-user', 'username'); bind('#s-status', 'status'); bind('#s-dc', 'discord'); bind('#s-bio', 'bio'); bind('#f-accent', 'accent');
  $('#acc-reset').onclick = () => { D.accent = ''; $('#f-accent').value = '#a855f7'; drawPreview(); };
  view.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    D[c.dataset.set] = c.dataset.v;
    $('#ch-' + c.dataset.set).querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
    drawPreview();
  });

  const pick = (kind) => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = async () => {
      if (!inp.files[0]) return;
      try {
        const data = await resizeImage(inp.files[0], kind === 'avatar' ? 256 : 1200, kind === 'avatar' ? 256 : 400);
        const r = await api('POST', '/api/me/image', { kind, data }); me = r.user;
        if (kind === 'avatar') { D.avatarUrl = ''; $('#f-avatar').value = ''; } else { D.bannerUrl = ''; $('#f-banner').value = ''; }
        renderUserArea(); drawPreview(); toast('Resim yüklendi.', 'ok');
      } catch (e) { fail(e); }
    };
    inp.click();
  };
  const remove = async kind => {
    try { const r = await api('DELETE', '/api/me/image/' + kind); me = r.user;
      if (kind === 'avatar') { D.avatarUrl = ''; $('#f-avatar').value = ''; } else { D.bannerUrl = ''; $('#f-banner').value = ''; }
      renderUserArea(); drawPreview(); toast('Kaldırıldı.', 'ok'); } catch (e) { fail(e); }
  };
  $('#up-av').onclick = () => pick('avatar'); $('#up-bn').onclick = () => pick('banner');
  $('#rm-av').onclick = () => remove('avatar'); $('#rm-bn').onclick = () => remove('banner');

  $('#s-save').onclick = async () => {
    try {
      const d = await api('PATCH', '/api/me', { username: D.username.trim(), status: D.status, discord: D.discord, bio: D.bio, accent: D.accent, borderFx: D.borderFx, fx: D.fx, avatar: D.avatarUrl, banner: D.bannerUrl });
      me = d.user; renderUserArea(); drawPreview(); toast('Profil kaydedildi.', 'ok');
    } catch (e) { fail(e); }
  };
  $('#p-save').onclick = async () => {
    try { await api('POST', '/api/me/password', { current: $('#p-cur').value, next: $('#p-new').value }); $('#p-cur').value = $('#p-new').value = ''; toast('Şifre güncellendi.', 'ok'); } catch (e) { fail(e); }
  };
}

/* ============================ ADMIN ============================ */
async function adminView() {
  if (!me) return needLogin();
  if (!me.can.banUsers) throw new Error('Bu sayfa için yetkin yok.');
  const [users, stats] = await Promise.all([api('GET', '/api/admin/users'), api('GET', '/api/admin/stats')]);
  const S = { tab: 'overview', q: '', rank: '', status: '' };
  const reload = async () => { const [u, st] = await Promise.all([api('GET', '/api/admin/users'), api('GET', '/api/admin/stats')]); users.length = 0; users.push(...u); Object.keys(stats).forEach(k => delete stats[k]); Object.assign(stats, st); draw(); };

  const userRow = u => `<div class="card u-row ${u.banned ? 'banned' : ''}">
    <div class="u-main">${avatar(u, 44)}<div style="min-width:0">${userLink(u)} ${rankBadge(u)} ${u.banned ? '<span class="rank" style="--c:#ef4444">Banned</span>' : ''}
      <small>Katılım: ${new Date(u.createdAt).toLocaleDateString('tr-TR')}${u.banned && u.banReason ? ' • Sebep: ' + esc(u.banReason) + (u.bannedBy ? ' (' + esc(u.bannedBy) + ')' : '') : ''}</small></div></div>
    <div class="u-act">
      ${me.can.siteAdmin && !u.root && u.id !== me.id && u.level < 40 && !u.banned ? `<button class="btn btn-ok btn-sm" data-quick="${u.id}"><i class="fa-solid fa-user-shield"></i> Admin Yap</button>` : ''}
      ${me.can.siteAdmin && !u.root ? `<select data-rank="${u.id}" title="Rank değiştir">${meta.ranks.map(r => `<option value="${r.id}" ${r.id === u.rank ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select>` : ''}
      ${me.can.siteAdmin && u.hasIp && !u.root ? `<button class="btn btn-ghost btn-sm" data-clearip="${u.id}" title="Bu IP'den yeni hesap açılmasına izin ver"><i class="fa-solid fa-network-wired"></i> IP Sıfırla</button>` : ''}
      ${u.id !== me.id && !u.root ? (u.banned ? `<button class="btn btn-ghost btn-sm" data-unban="${u.id}"><i class="fa-solid fa-unlock"></i> Ban Kaldır</button>` : `<button class="btn btn-bad btn-sm" data-ban="${u.id}" data-name="${esc(u.username)}"><i class="fa-solid fa-ban"></i> Banla</button>`) : ''}
    </div></div>`;

  function body() {
    if (S.tab === 'overview') {
      const max = Math.max(1, ...stats.ranks.map(r => r.count));
      return `<h1 class="adm-title">Genel Bakış</h1><p class="adm-sub">Sitenin anlık durumu.</p>
      <div class="stats">
        <div class="card stat" style="--c:#a855f7"><i class="fa-solid fa-users"></i><b>${stats.users}</b><span>Toplam kullanıcı</span></div>
        <div class="card stat" style="--c:#3b82f6"><i class="fa-solid fa-user-plus"></i><b>${stats.newToday}</b><span>Son 24 saatte katılan</span></div>
        <div class="card stat" style="--c:#10b981"><i class="fa-solid fa-user-shield"></i><b>${stats.staff}</b><span>Yetkili</span></div>
        <div class="card stat" style="--c:#ef4444"><i class="fa-solid fa-ban"></i><b>${stats.banned}</b><span>Banlı</span></div>
        <div class="card stat" style="--c:#f59e0b"><i class="fa-solid fa-comments"></i><b>${stats.threads}</b><span>Konu • ${stats.posts} mesaj</span></div></div>
      <div class="two-col">
        <div class="card panel"><h3><i class="fa-solid fa-chart-simple" style="color:var(--a3)"></i> Rank Dağılımı</h3>
          ${stats.ranks.map(r => `<div class="bar-row"><span style="color:${esc(r.color)};font-weight:600">${esc(r.name)}</span><div class="bar-track"><i style="width:${Math.round(r.count / max * 100)}%;--c:${esc(r.color)}"></i></div><b>${r.count}</b></div>`).join('')}</div>
        <div class="card panel"><h3><i class="fa-solid fa-clock-rotate-left" style="color:var(--a3)"></i> Son Kayıtlar</h3>
          ${stats.recent.map(u => `<div class="mini-u">${avatar(u, 36)}<div>${userLink(u)}<small>${ago(u.createdAt)}</small></div><span style="margin-left:auto">${rankBadge(u)}</span></div>`).join('') || '<p class="muted">Henüz kayıt yok.</p>'}</div>
      </div>`;
    }
    if (S.tab === 'prefix') return `<h1 class="adm-title">Forum Prefixleri</h1><p class="adm-sub">Konulara verilen etiketler (On Consideration, Approved...).</p>
      <div class="card panel"><div>${meta.prefixes.map(p => `<span class="pf-chip"><span class="prefix" style="--c:${esc(p.color)};margin:0">${esc(p.name)}</span><button data-pfdel="${esc(p.id)}" title="Sil"><i class="fa-solid fa-xmark"></i></button></span>`).join('')}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><input id="pf-name" placeholder="Yeni prefix adı" maxlength="24" style="max-width:240px"><input id="pf-color" type="color" value="#a855f7" style="width:60px;padding:4px;height:46px"><button class="btn btn-primary btn-sm" id="pf-add"><i class="fa-solid fa-plus"></i> Prefix Ekle</button></div></div>`;
    if (S.tab === 'staff') {
      const staff = users.filter(u => u.level >= 30);
      return `<h1 class="adm-title">Yetkili Ekibi</h1><p class="adm-sub">Rank'a göre gruplanmış yetkililer.</p>` + meta.ranks.filter(r => r.level >= 30).map(r => { const l = staff.filter(u => u.rank === r.id); return `<div class="grp-title" style="color:${esc(r.color)}">${esc(r.name)} <small>${l.length} kişi</small></div>${l.length ? l.map(userRow).join('') : '<div class="card empty" style="padding:16px">Bu rankta kimse yok.</div>'}`; }).join('');
    }
    if (S.tab === 'banned') { const l = users.filter(u => u.banned); return `<h1 class="adm-title">Banlılar</h1><p class="adm-sub">${l.length} banlı hesap.</p>` + (l.length ? l.map(userRow).join('') : `<div class="card empty">Banlı kullanıcı yok.</div>`); }
    const q = S.q.toLowerCase();
    const l = users.filter(u => (!q || u.username.toLowerCase().includes(q)) && (!S.rank || u.rank === S.rank) && (!S.status || (S.status === 'banned' ? u.banned : !u.banned)));
    return `<h1 class="adm-title">Kullanıcılar</h1><p class="adm-sub">${users.length} kayıtlı hesap. Rank ver, banla.</p>
      <div class="adm-bar"><input id="u-q" placeholder="Kullanıcı ara..." value="${esc(S.q)}">
      <select id="u-rank"><option value="">Tüm rankler</option>${meta.ranks.map(r => `<option value="${r.id}" ${S.rank === r.id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select>
      <select id="u-status"><option value="">Tüm durumlar</option><option value="active" ${S.status === 'active' ? 'selected' : ''}>Aktif</option><option value="banned" ${S.status === 'banned' ? 'selected' : ''}>Banlı</option></select></div>
      <div id="u-list">${l.length ? l.map(userRow).join('') : '<div class="card empty">Sonuç yok.</div>'}</div>`;
  }

  function draw() {
    const tabs = [['overview', 'fa-gauge-high', 'Genel Bakış', ''], ['users', 'fa-users', 'Kullanıcılar', stats.users], ['staff', 'fa-user-shield', 'Yetkili Ekibi', stats.staff], ['banned', 'fa-ban', 'Banlılar', stats.banned], ['prefix', 'fa-tags', 'Prefixler', meta.prefixes.length]];
    view.innerHTML = `<div class="wrap page"><div class="adm">
      <aside class="card adm-side"><div class="adm-me">${avatar(me, 42)}<div><b>${esc(me.username)}</b>${rankBadge(me)}</div></div>
        <nav class="adm-nav">${tabs.map(t => `<button data-tab="${t[0]}" class="${S.tab === t[0] ? 'on' : ''}"><i class="fa-solid ${t[1]}"></i> ${t[2]}${t[3] !== '' ? `<span class="cnt">${t[3]}</span>` : ''}</button>`).join('')}</nav></aside>
      <section id="adm-body">${body()}</section></div></div>`;
    wire();
  }

  function refreshList() {
    const q = S.q.toLowerCase();
    const l = users.filter(u => (!q || u.username.toLowerCase().includes(q)) && (!S.rank || u.rank === S.rank) && (!S.status || (S.status === 'banned' ? u.banned : !u.banned)));
    $('#u-list').innerHTML = l.length ? l.map(userRow).join('') : '<div class="card empty">Sonuç yok.</div>';
    wireRows();
  }

  function wireRows() {
    view.querySelectorAll('[data-rank]').forEach(s => s.onchange = async () => { try { await api('POST', `/api/admin/users/${s.dataset.rank}/rank`, { rank: s.value }); toast('Rank güncellendi.', 'ok'); } catch (e) { fail(e); } reload(); });
    view.querySelectorAll('[data-quick]').forEach(b => b.onclick = async () => { try { await api('POST', `/api/admin/users/${b.dataset.quick}/rank`, { rank: 'administrator' }); toast('Administrator yapıldı.', 'ok'); } catch (e) { fail(e); } reload(); });
    view.querySelectorAll('[data-unban]').forEach(b => b.onclick = async () => { try { await api('POST', `/api/admin/users/${b.dataset.unban}/ban`, { banned: false }); toast('Ban kaldırıldı.', 'ok'); } catch (e) { fail(e); } reload(); });
    view.querySelectorAll('[data-clearip]').forEach(b => b.onclick = async () => { if (!confirm('Bu kullanıcının IP kaydı silinsin mi? (Aynı IP\'den yeni hesap açılabilir)')) return; try { await api('POST', `/api/admin/users/${b.dataset.clearip}/clear-ip`, {}); toast('IP kaydı silindi.', 'ok'); } catch (e) { fail(e); } reload(); });
    view.querySelectorAll('[data-ban]').forEach(b => b.onclick = () => {
      modal(`<h3><i class="fa-solid fa-ban"></i> ${esc(b.dataset.name)} banlansın mı?</h3>
        <div class="field"><label>Ban sebebi (kullanıcı giriş yapmaya çalışınca görür)</label><input id="b-reason" maxlength="200" placeholder="örn. Hile kullanımı"></div>
        <div class="modal-buttons"><button class="btn btn-ghost btn-sm" onclick="closeModal()">İptal</button><button class="btn btn-bad btn-sm" id="b-ok">Banla</button></div>`);
      $('#b-ok').onclick = async () => { try { await api('POST', `/api/admin/users/${b.dataset.ban}/ban`, { banned: true, reason: $('#b-reason').value }); closeModal(); toast('Kullanıcı banlandı.', 'ok'); } catch (e) { fail(e); } reload(); };
    });
  }

  function wire() {
    view.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; draw(); });
    const q = $('#u-q');
    if (q) {
      q.oninput = () => { S.q = q.value; refreshList(); };
      $('#u-rank').onchange = e => { S.rank = e.target.value; refreshList(); };
      $('#u-status').onchange = e => { S.status = e.target.value; refreshList(); };
    }
    wireRows();
    const add = $('#pf-add');
    if (add) add.onclick = async () => { try { const r = await api('POST', '/api/forum/prefixes', { name: $('#pf-name').value, color: $('#pf-color').value }); meta.prefixes = r.prefixes; draw(); } catch (e) { fail(e); } };
    view.querySelectorAll('[data-pfdel]').forEach(b => b.onclick = async () => { if (!confirm('Prefix silinsin mi?')) return; try { const r = await api('DELETE', '/api/forum/prefixes/' + b.dataset.pfdel); meta.prefixes = r.prefixes; draw(); } catch (e) { fail(e); } });
  }
  draw();
}

/* ============================ boot ============================ */
(async function () {
  try { const [m, mt] = await Promise.all([api('GET', '/api/me'), api('GET', '/api/meta')]); me = m.user; meta = mt; } catch (e) {}
  renderUserArea();
  route();
})();
</script>
</body>
</html>
